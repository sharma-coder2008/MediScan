<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediScan</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 16px; }
    .card { max-width: 520px; margin: 30px auto; background: #fff; padding: 24px;
            border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
    h1 { margin-top: 0; color: #0b6e4f; }
    select, button { padding: 10px 14px; border-radius: 8px; margin-top: 12px; }
    button { background: #0b6e4f; color: #fff; border: 0; cursor: pointer; }
    pre { background: #f1f1f1; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    img { max-width: 100%; margin-top: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MediScan</h1>
    <p>Medicine strip ki photo upload karo.</p>
    <input type="file" id="file" accept="image/*" capture="environment">
    <img id="preview" style="display:none">
    <br>
    <select id="lang">
      <option>English</option>
      <option>Hindi</option>
      <option>Punjabi</option>
    </select>
    <br>
    <button id="btn" onclick="send()">Scan karo</button>
    <pre id="out"></pre>
  </div>

  <script>
    let b64 = null;

    // Image ko resize karte hain taaki Vercel ki 4.5 MB request limit cross na ho
    document.getElementById("file").onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * scale;
        c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL("image/jpeg", 0.8);
        b64 = dataUrl.split(",")[1];   // sirf base64 part
        const p = document.getElementById("preview");
        p.src = dataUrl;
        p.style.display = "block";
      };
      img.src = URL.createObjectURL(f);
    };

    async function send() {
      const out = document.getElementById("out");
      if (!b64) { out.textContent = "Pehle image choose karo"; return; }
      out.textContent = "Processing...";
      try {
        const r = await fetch("/api/identify-medicine", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: b64, language: document.getElementById("lang").value })
        });
        out.textContent = JSON.stringify(await r.json(), null, 2);
      } catch (err) {
        out.textContent = "Error: " + err;
      }
    }
  </script>
</body>
</html>
